[workspace]
members = [
    "crates/service-core",
    "crates/static-syntax",
    "crates/lsp",
    "crates/mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/epi13/mncs-language-service"
rust-version = "1.85"

[workspace.dependencies]
mncs-syntax = { git = "https://github.com/epi13/mncs-language", branch = "main" }
mncs-model = { git = "https://github.com/epi13/mncs-language", branch = "main" }
mncs-compiler = { git = "https://github.com/epi13/mncs-language", branch = "main" }
mncs-codegen = { git = "https://github.com/epi13/mncs-language", branch = "main" }
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
tower-lsp = "0.20"
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = "1"

[profile.release]
lto = "thin"

# The resident service hashes its loaded executable to bind semantic
# continuity. Keep SHA-256 optimized in debug/test hosts as well: an
# unoptimized pass over a 105 MB test image measured 3.97 s wall / 3.98 s CPU.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
